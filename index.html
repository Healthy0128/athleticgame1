<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#75d6f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skybound">
  <meta name="format-detection" content="telephone=no">
  <title>Skybound Sprint</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Skybound Sprint</h1>
        <p>Chat上で作った横スクロール・アスレチック試作</p>
      </div>
      <div class="hud">
        <span id="hearts" class="hearts">♥♥♥</span>
        <span id="stage">STAGE 1/5</span>
        <span id="coins">COIN 0</span>
        <span id="time">TIME 0.0</span>
        <span id="status">READY</span>
      </div>
    </header>

    <section class="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="2D platform action game"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="panel">
          <h2>Skybound Sprint</h2>
          <p>ゴール旗まで駆け抜けよう。</p>
          <p class="controls">← → / A D：移動　Space / W / ↑：ジャンプ　方向キー2連打：ダッシュ　壁際ジャンプ：壁キック</p>
          <button id="startBtn">START</button>
        </div>
      </div>
    </section>

    <section class="help">
      <button id="restartBtn">RESTART</button>
      <button id="muteBtn">SOUND ON</button>
      <span id="controllerStatus">スマホ / キーボード / Xboxコントローラー対応</span>
    </section>

    <section class="touch-controls" aria-label="タッチ操作">
      <div class="touch-left">
        <button class="move-btn" data-key="ArrowLeft" aria-label="左へ移動">◀</button>
        <button class="move-btn" data-key="ArrowRight" aria-label="右へ移動">▶</button>
      </div>
      <div class="touch-right">
        <button class="jump-btn" data-key="Space" aria-label="ジャンプ">JUMP</button>
      </div>
    </section>
  </main>

  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
