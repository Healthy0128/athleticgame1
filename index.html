<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Skybound Sprint</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Skybound Sprint</h1>
        <p>Chat上で作った横スクロール・アスレチック試作</p>
      </div>
      <div class="hud">
        <span id="coins">COIN 0</span>
        <span id="time">TIME 0.0</span>
        <span id="status">READY</span>
      </div>
    </header>

    <section class="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="2D platform action game"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="panel">
          <h2>Skybound Sprint</h2>
          <p>ゴール旗まで駆け抜けよう。</p>
          <p class="controls">← → / A D：移動　Space / W / ↑：ジャンプ　Shift：ダッシュ</p>
          <button id="startBtn">START</button>
        </div>
      </div>
    </section>

    <section class="help">
      <button id="restartBtn">RESTART</button>
      <button id="muteBtn">SOUND ON</button>
      <span>スマホ：画面下の仮想ボタン対応</span>
    </section>

    <section class="touch-controls" aria-label="タッチ操作">
      <div class="touch-left">
        <button data-key="ArrowLeft">◀</button>
        <button data-key="ArrowRight">▶</button>
      </div>
      <div class="touch-right">
        <button data-key="ShiftLeft">DASH</button>
        <button data-key="Space">JUMP</button>
      </div>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
