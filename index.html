<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#75d6f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skybound">
  <meta name="format-detection" content="telephone=no">
  <title>Skybound Sprint</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><h1>Skybound Sprint</h1><p>Momentum platformer</p></div>
      <div class="hud">
        <span id="hearts" class="hearts">♥♥♥</span><span id="stage">STAGE 1/12</span><span id="stars">★ 0/3</span><span id="coins">COIN 0</span><span id="time">TIME 0.0</span><span id="status">READY</span>
      </div>
    </header>
    <section class="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="Skybound Sprint game"></canvas>
      <div class="overlay" id="overlay"><div class="panel" id="panel">
        <h2 id="overlayTitle">Skybound Sprint</h2><p id="overlayText">12ステージ。走って、跳んで、壁を蹴って、風・水・追跡ギミックを突破しよう。</p>
        <div id="resultBox" class="result-box hidden"></div>
        <div class="menu" id="mainMenu"><button id="playBtn">PLAY</button><button id="stageSelectBtn" class="secondary">STAGE SELECT</button><button id="ghostBtn" class="secondary">GHOST: ON</button></div>
        <div id="stageSelect" class="stage-select hidden"></div>
        <p class="controls">移動：← → / A D　ジャンプ：Space / Aボタン　ダッシュ：同方向2連打　壁際ジャンプ：壁キック　ESC / START：ポーズ</p>
        <p class="credits-mini">音楽・一部効果音：魔王魂（森田交一） / Graphics: Kenney</p>
      </div></div>
    </section>
    <section class="help"><button id="restartBtn">RESTART</button><button id="muteBtn">SOUND ON</button><span id="controllerStatus">スマホ / キーボード / Xboxコントローラー対応</span></section>
    <section class="touch-controls" aria-label="タッチ操作"><div class="touch-left"><button class="move-btn" data-key="left" aria-label="左へ移動">◀</button><button class="move-btn" data-key="right" aria-label="右へ移動">▶</button></div><div class="touch-right"><button class="jump-btn" data-key="jump" aria-label="ジャンプ">JUMP</button></div></section>
  </main>
  <script src="js/game-data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/game-render.js"></script>
  <script src="js/game-input.js"></script>
  <script src="js/game-phase2.js"></script>
  <script src="js/game-fixes.js"></script>
  <script src="js/game-fullpower.js"></script>
  <script src="js/boot.js"></script>
  <script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body>
</html>
